name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.1.0, v2.0.0, etc.

# Add permissions for the GITHUB_TOKEN
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ble
            asset_name: ble-linux-x86_64
            use_cross: false

          # Linux ARM64 (using cross for proper cross-compilation)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ble
            asset_name: ble-linux-aarch64
            use_cross: true

          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ble
            asset_name: ble-macos-x86_64
            use_cross: false

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ble
            asset_name: ble-macos-aarch64
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ble.exe
            asset_name: ble-windows-x86_64.exe
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Linux and macOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            echo "Skipping strip for cross-compiled binary (already optimized)"
          else
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -R ./artifacts

      - name: Check if pre-release
        id: check-prerelease
        run: |
          # Auto-detect pre-release based on tag name
          # Pre-release if tag contains: alpha, beta, rc, pre, dev, or starts with v0.
          if [[ "${GITHUB_REF_NAME}" =~ (alpha|beta|rc|pre|dev) ]] || [[ "${GITHUB_REF_NAME}" =~ ^v0\. ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release: ${GITHUB_REF_NAME}"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release: ${GITHUB_REF_NAME}"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.check-prerelease.outputs.prerelease }}
          fail_on_unmatched_files: true
