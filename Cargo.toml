[package]
name = "ble"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
config = "0.15.19"
eyre = "0.6.12"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
url = "2.5.8"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scraper = "0.25.0"

[dev-dependencies]
wiremock = "0.6.5"
